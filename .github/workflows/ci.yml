name: CI

on:
  push:
    branches: [ "main", "cycle-2-production-hardening" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up UID/GID for non-root Docker
        run: |
          echo "UID=$(id -u)" >> $GITHUB_ENV
          echo "GID=$(id -g)" >> $GITHUB_ENV

      - name: Create htmlcov directory (to avoid mount issues)
        run: mkdir -p htmlcov

      - name: Set up Docker Buildx + Compose
        uses: docker/setup-buildx-action@v3

      - name: Run tests in Docker (exactly like local)
        run: |
          docker compose -f docker-compose-test.yml down
          docker compose -f docker-compose-test.yml build --no-cache
          docker compose -f docker-compose-test.yml up --exit-code-from test
        env:
          UID: ${{ env.UID }}
          GID: ${{ env.GID }}

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/omniai-core

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}