
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: omniai_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    #volumes:
      #- postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    ports:
      - "8000:8000"
    # ✅ Load ALL app config from .env — no duplication
    # ✅ DO NOT hardcode JWT_SECRET_KEY here!
    # 👇 CRITICAL: Use .env.test.docker so app connects to omniai_test
    env_file:
      - .env.test.docker   # ← This loads JWT_SECRET_KEY from your .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      OMNIAI_DISABLE_RATE_LIMIT: 1
    volumes:
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Test service
  test:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    env_file:
      - .env.test.docker  
    depends_on:
      app:
        condition: service_healthy
    environment:
      # So psql/pg_isready/dropdb don't prompt for password
      # OMNIAI_DISABLE_RATE_LIMIT: 1
      PGPASSWORD: postgres
    command: >
      sh -c "
        echo '⏳ Waiting for DB...' &&
        pg_isready -h db -U postgres &&

        echo '🚀 Waiting for app health check...' &&
        timeout 30 sh -c 'while ! curl -s --fail http://app:8000/v1/health/ready; do sleep 1; done' &&

        echo '✅ App is ready!' &&

        echo '🔍 Running static analysis...' &&
        ruff check . &&
        mypy src/ &&
        bandit -r src/ -ll -x \"**/migrations/**,**/__pycache__/**\" &&
        safety check --full-report &&

        echo '🧪 Running tests...' &&
        pytest -v --tb=short
      "

volumes:
  postgres_data: